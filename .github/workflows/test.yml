name: Test

# Runs on every pull request and on main. macOS 15 is the deployment target and
# macOS 26 the newer OS; testing only the newest hides OS-specific behaviour.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The engine (ChorusEngine 1.5.36) needs Xcode 26. macos-15 defaults to
      # Xcode 16.4, which cannot build it, so pick the newest Xcode installed
      # rather than trusting the default. Betas and release candidates are
      # skipped, so a preview Xcode never decides a run.
      - name: Use the newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app | grep -viE 'beta|rc|release.candidate' | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: StaveCore package tests
        run: swift test --package-path Packages/StaveCore

      # Debug, unsigned: the runner has no signing identity and needs none.
      - name: Build the app
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build \
            -project Stave.xcodeproj \
            -scheme Stave \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      # Release, unsigned: catches code that only compiles in Debug (e.g. #if DEBUG hooks).
      - name: Build the app (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stave.xcodeproj \
            -scheme Stave \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Release build carries the engine bundle
        run: |
          bundle=build/DD/Build/Products/Release/Stave.app/Contents/Resources/ChorusEngine_ChorusEngine.bundle
          test -d "$bundle"
          test -f "$bundle/Contents/Resources/hagezi-light.json"
